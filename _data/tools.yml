# Tools I built. One list for the Tools page, the home page and the AI page.
# tagline: what it is for, in a few words. desc: what it does, in one sentence.
# url: the article. action: the main button (optional).
# poster: a 16:10 picture. anim: the demo that plays on hover (optional).
# shortcuts: drawn keyboard shortcuts instead of a picture.
# accent: the colour of the card. featured: the big card on the Tools page.
# home: a card on the home page. ai: built with AI (Claude Code, and now Codex too).
- name: Snipou
  tagline: Screenshots that explain.
  desc: Capture a piece of your screen, annotate it, and tell a whole process on a whiteboard.
  points:
    - "One hotkey: a region, a window, or just the table inside it."
    - Numbered steps, arrows and blur, then paste anywhere.
    - Whiteboards with sixteen themes, clean or hand-drawn.
  kind: Windows
  url: /tools/snipou
  action:
    label: Download for Windows
    url: https://github.com/arnaudgastelblum/snipou-releases/releases/latest/download/snipou-setup.exe
  poster: /assets/2026/tools/snipou.webp
  anim: /assets/2026/snipou/annotate.gif
  accent: "#6d5ef5"
  featured: true
  home: true
  ai: true

