- name: SSMS in VS Code
  tagline: SSMS shortcuts in VS Code.
  desc: "Box selection, Ctrl+R for the results and Ctrl+3 for a SELECT TOP 1000: a shortcuts file and a small extension."
  kind: VS Code
  url: /sql-server/make-vs-code-look-and-feel-like-ssms
  shortcuts:
    - combo: [Ctrl, R]
      label: Show or hide the results
    - combo: [Shift, Alt]
      label: Drag to select a column
    - combo: [Ctrl, "1"]
      label: Run your query shortcuts
  accent: "#2f6fd1"
