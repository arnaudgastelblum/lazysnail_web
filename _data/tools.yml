- name: SSMS in VS Code
  tagline: Your SSMS habits, in VS Code.
  desc: Column selection, Ctrl+R for the results and your query shortcuts, with an extension to download.
  kind: VS Code
  url: /sql-server/make-vs-code-look-and-feel-like-ssms
  shortcuts:
    - combo: [Ctrl, R]
      label: Show or hide the results
    - combo: [Shift, Alt]
      label: Drag to select a column
    - combo: [Ctrl, "1"]
      label: Run your query shortcuts
  accent: "#2f6fd1"
  ai: true

