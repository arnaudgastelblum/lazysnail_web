# Tools I built. One list for the Tools page, the home page and the AI page.
# tagline: what it is for, in a few words. desc: what it does, in one sentence.
# url: the article. action: the main button (optional).
# store: the Microsoft Store listing; its official badge replaces the button.
# poster: a 16:10 picture. anim: the demo that plays on hover (optional).
# shortcuts: drawn keyboard shortcuts instead of a picture.
# accent: the colour of the card. featured: the big card on the Tools page.
# home: a card on the home page. ai: built with AI (Claude Code, and now Codex too).
- name: Fabric Source Atlas
  tagline: See which tables feed your Power BI models.
  desc: PowerShell scripts that scan your Fabric workspaces and list every table, view and file each semantic model reads, in Excel and a web page.
  kind: PowerShell · Fabric
  url: /fabric/fabric-source-atlas
  action:
    label: Get it on GitHub
    url: https://github.com/arnaudgastelblum/fabric-source-atlas
  poster: /assets/2026/tools/fabric-source-atlas.webp
  anim: /assets/2026/fabric-source-atlas/run-in-terminal.gif
  accent: "#0f8b7d"
  home: true
  ai: true

- name: Snipou
  tagline: Capture, annotate and record your screen.
  desc: Grab a region or a window, add numbered steps, arrows and blur, then paste it anywhere. It also records your screen and edits the video.
  points:
    - "One hotkey: a region, a window, or just the table inside it."
    - Numbered steps, arrows and blur, then paste anywhere.
    - Whiteboards with sixteen themes, clean or hand-drawn.
    - Screen recordings and a video editor with animated intros and outros.
  kind: Windows
  url: /tools/snipou
  store: https://apps.microsoft.com/detail/9MZSSPHWZ8BL
  poster: /assets/2026/tools/snipou.webp
  anim: /assets/2026/snipou/annotate.gif
  accent: "#6d5ef5"
  featured: true
  home: true
  ai: true

# FeedMe: when the Store listing is live, replace `action` by `store: <listing URL>`.
- name: FeedMe
  tagline: Your websites, YouTube and Reddit in one reader.
  desc: Follow sites, channels and subreddits, save articles to read later, highlight and take notes. Free, and everything stays on your PC.
  points:
    - Paste an address, FeedMe finds the feed.
    - A clean reading view, light or dark, and a focus mode.
    - Read later with offline copies, one click from your browser.
    - Highlights and notes, gathered in a searchable Notebook.
  kind: Windows
  url: /tools/feedme
  action:
    label: Download
    url: https://github.com/arnaudgastelblum/feedme-releases/releases/latest/download/FeedMe-setup.exe
  poster: /assets/2026/tools/feedme.webp
  anim: /assets/2026/feedme/hero.webp
  accent: "#2563eb"
  home: true
  ai: true

